openapi: 3.0.3

info:
  title: Trade Lab API — Agent
  version: 1.0.0
  description: Agent scaffolding endpoints

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Agent
    description: Agent integrations

paths:

  /agent/evaluatePortfolio:
    post:
      tags:
        - Agent
      summary: Evaluate a portfolio
      operationId: evaluatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatePortfolioRequest'
      responses:
        '200':
          description: Portfolio evaluation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatePortfolioResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    EvaluatePortfolioRequest:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          format: uuid

    EvaluatePortfolioResponse:
      type: object
      required:
        - accountId
        - status
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - NOT_IMPLEMENTED

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - details
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: string
          example:
            - "accountId is required"
