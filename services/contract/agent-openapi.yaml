openapi: 3.0.3

info:
  title: Trade Lab API — Agent
  version: 1.0.0
  description: Agent chat endpoints

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Agent
    description: AI assistant interactions

paths:

  /agent/query:
    post:
      tags:
        - Agent
      summary: Query the Trade Lab AI assistant
      description: >
        Request a streamed assistant reply. Clients receive Server-Sent Events when the
        `Accept` header is `text/event-stream` or `*/*`, and streaming is also the default
        when the header is omitted; send `Accept: application/json` to request the buffered
        fallback response.
      operationId: queryAgent
      parameters:
        - in: header
          name: Accept
          required: false
          schema:
            type: string
          description: >
            Response negotiation header. Use `text/event-stream` or `*/*` for token streaming,
            omit the header for the default streaming response, or send `application/json`
            for the buffered fallback reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentQueryRequest'
      responses:
        '200':
          description: >
            Assistant response stream or buffered fallback. Server-Sent Event text chunks use
            the default `message` event. After a turn with one or more filled orders, the stream
            also emits a `trade-executed` event with a JSON `TradeExecutedEvent` payload.
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
              x-sse-events:
                - name: trade-executed
                  contentType: application/json
                  schema:
                    $ref: '#/components/schemas/TradeExecutedEvent'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentQueryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Assistant unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agent/summary:
    get:
      tags:
        - Agent
      summary: Get the authenticated user's previous conversation summary
      description: >
        Returns the authenticated user's durable previous-conversation summary when one exists, together with the user's greeting name (resolved whenever available, regardless of whether a summary is present).
      operationId: getConversationSummary
      responses:
        '200':
          description: Conversation summary or greeting name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    AgentQueryRequest:
      type: object
      required:
        - accountId
        - conversationId
        - message
      properties:
        accountId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          pattern: '.*\S.*'

    AgentQueryResponse:
      type: object
      required:
        - conversationId
        - reply
      properties:
        conversationId:
          type: string
          format: uuid
        reply:
          type: string

    TradeExecutedEvent:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          format: uuid

    AgentSummaryResponse:
      type: object
      properties:
        summary:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: >
            The user's greeting name (first name or display name), resolved whenever available regardless of whether a summary is present. Null only when no name can be resolved.

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - details
      properties:
        status:
          type: integer
          example: 503
        error:
          type: string
          example: Assistant unavailable
        details:
          type: array
          items:
            type: string
          example:
            - "The AI assistant is temporarily unavailable."
