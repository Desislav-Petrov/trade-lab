# Local profile — activate with: SPRING_PROFILES_ACTIVE=local
#
# Uses a persistent file-based H2 database so data survives application restarts.
# This profile is also used by docker-compose for local container runs.
#
# DATASOURCE_URL — if set, must be a full JDBC URL, e.g.:
#   jdbc:h2:file:/absolute/path/to/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
# H2_DB_PATH — optional bare file path override (no jdbc: prefix).
#   When set, takes precedence and is composed into the full JDBC URL automatically.
#   Example: H2_DB_PATH=/tmp/mydb  →  jdbc:h2:file:/tmp/mydb;...
#   Leave unset to use the default ./data/tradelab path relative to the working directory.

spring:
  datasource:
    url: "jdbc:h2:file:${H2_DB_PATH:./data/tradelab};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
  jpa:
    # Explicit dialect — Hibernate 6 (Spring Boot 4) removed the automatic
    # dialect detection fallback. This overrides the base application.yml value
    # but keeps the same H2Dialect since we're still using H2 in local.
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 'update' — schema evolves with entities; existing data is preserved.
      ddl-auto: update
  h2:
    console:
      enabled: true   # Inspect local DB at http://localhost:8080/h2-console
