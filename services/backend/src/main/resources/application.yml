spring:
  datasource:
    # Local development: file-based H2 so data persists across application restarts.
    # Override via DATASOURCE_URL environment variable if needed.
    # Production profile (application-prod.yml) replaces this with PostgreSQL.
    url: ${DATASOURCE_URL:jdbc:h2:file:./data/tradelab;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 'update' — schema evolves with entities; existing data is preserved.
      # Tests override this to 'create-drop' via application-test.yml.
      # Production overrides this to 'validate' via application-prod.yml.
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true   # Inspect local DB at http://localhost:8080/h2-console
  boot:
    admin:
      context-path: /admin   # Spring Boot Admin UI served at /admin
      client:
        url: http://localhost:8080/admin      # Admin server registration endpoint
        instance:
          service-url: http://localhost:8080  # Base URL the Admin server uses to scrape actuator data
  security:
    oauth2:
      client:
        registration:
          google:
            # In production supply GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET via environment variables.
            # Defaults below allow the application context to start in local/test environments
            # without real Google credentials; OAuth2 login will not function until real values are set.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: read:user,user:email
        provider:
          google:
            # Explicit URIs avoid an HTTP call to Google's OIDC discovery endpoint on startup.
            # These match the standard Google OAuth2 provider endpoints.
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Full actuator endpoints exposed in dev/non-prod environments only.
        # The prod profile (application-prod.yml) restricts this to health only.
        include:
          - health
          - info
          - metrics
          - mappings
          - env
          - beans
          - loggers
          - threaddump
          - conditions
  endpoint:
    health:
      show-details: always
    env:
      show-values: never   # never expose secret property values
  info:
    env:
      enabled: true

info:
  app:
    name: trade-lab
    description: Paper trading platform

app:
  features:
    enable-synthetic-data: ${ENABLE_SYNTHETIC_DATA:true}
    enable-real-data: ${ENABLE_REAL_DATA:true}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-32c}
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

finnhub:
  api-key: ${FINNHUB_API_KEY:demo}
