name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/desislav-petrov/trade-lab-backend
  IMAGE_NAME_FRONTEND: ghcr.io/desislav-petrov/trade-lab-frontend

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Version: ${VERSION}"

  backend-build:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x services/backend/gradlew

      - name: Build and push Docker image with Jib
        working-directory: services/backend
        env:
          JIB_TO_AUTH_USERNAME: ${{ github.actor }}
          JIB_TO_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew jib \
            -PimageVersion=v${{ needs.extract-version.outputs.version }} \
            -Djib.console=plain
          echo "✅ Backend image built and pushed: ${{ env.IMAGE_NAME_BACKEND }}:v${{ needs.extract-version.outputs.version }}"

  frontend-build:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/front-end
          file: services/front-end/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME_FRONTEND }}:v${{ needs.extract-version.outputs.version }}
            ${{ env.IMAGE_NAME_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=v${{ needs.extract-version.outputs.version }}
        env:
          BUILDKIT_PROGRESS: plain

  publish:
    needs: [extract-version, backend-build, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify images published
        run: |
          echo "✅ Backend image: ${{ env.IMAGE_NAME_BACKEND }}:v${{ needs.extract-version.outputs.version }}"
          echo "✅ Frontend image: ${{ env.IMAGE_NAME_FRONTEND }}:v${{ needs.extract-version.outputs.version }}"
          echo "🎉 All images published to GHCR successfully"

  create-release:
    needs: [extract-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
